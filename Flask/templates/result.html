<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result - Eye Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container result-page">
        <h2>Detection Result</h2>
        {% if filename %}
            <div class="result-card">
                <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image" class="result-image">
                <div class="prediction-box">
                    <h3>Prediction: <span class="prediction-text">{{ prediction }}</span></h3>
                </div>
            </div>
        {% endif %}
        <a href="/" class="back-link">Analyze Another Image</a>
    </div>
</body>
</html>
