    <div class="container about-page">
        <h2>About This Project</h2>
        <p>This system uses a CNN to detect eye diseases from retinal fundus images.</p>
        <h3>Supported Diseases</h3>
        <ul>
            <li><strong>Normal</strong> - Healthy eye</li>
            <li><strong>Diabetic Retinopathy</strong> - Retinal blood vessel damage</li>
            <li><strong>Cataract</strong> - Clouding of the eye lens</li>
            <li><strong>Glaucoma</strong> - Optic nerve damage</li>
        </ul>
